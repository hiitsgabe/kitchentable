# A Flutter iOS build on EAS, signed with the project's EAS credentials.
#
# Not Expo Launch's workflow: that one exports FLUTTER_BUILD_NAME and then
# runs flutter build, which Flutter refuses. Here the version comes from
# pubspec through Generated.xcconfig, the way Flutter means it to, and
# FLUTTER_BUILD_NAME is never put in the environment. The signing half
# reuses EAS's own functions, after Expo's ios-build-with-credentials
# example, so the certificate and profile are the ones already on the
# project.
build:
  name: iOS Flutter build
  steps:
    - eas/checkout
    - run:
        name: Install Flutter
        command: |
          set -eux
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable "$HOME/flutter-sdk"
          set-env PATH "$HOME/flutter-sdk/bin:$PATH"
          export PATH="$HOME/flutter-sdk/bin:$PATH"
          flutter config --no-analytics --no-cli-animations
          flutter --version
          flutter precache --ios
    - run:
        name: Flutter pub get
        command: |
          export PATH="$HOME/flutter-sdk/bin:$PATH"
          flutter pub get
    - eas/resolve_apple_team_id_from_credentials:
        id: team
    - run:
        name: Flutter build iOS (no codesign)
        command: |
          export PATH="$HOME/flutter-sdk/bin:$PATH"
          flutter build ios --release --no-codesign \
            --dart-define=HOME_URL=https://hiitsgabe.github.io/kitchentable/ \
            --dart-define=BUILD="${EAS_BUILD_GIT_COMMIT_HASH:0:7}"
    - eas/configure_ios_credentials
    - eas/generate_gymfile_from_template:
        inputs:
          credentials: ${ eas.job.secrets.buildCredentials }
    - eas/run_fastlane
    - eas/find_and_upload_build_artifacts
