name: Build iOS app

# Triggered by hand (eas workflow run / the Expo MCP), not on push: this runs
# the standard EAS Build pipeline for the production profile in eas.json,
# rather than Expo Launch's Flutter workflow, whose Flutter SDK step exports
# FLUTTER_BUILD_NAME and makes `flutter build` abort. The version comes from
# pubspec.yaml because eas.json sets appVersionSource: local.

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production
